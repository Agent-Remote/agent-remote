name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Verify release workflow contract
        run: python3 tests/release_workflow_contract_test.py
      - name: Verify pinned GitHub CLI installer
        run: |
          bash scripts/install-github-cli.sh
          "$(tail -n 1 "$GITHUB_PATH")/gh" version | grep -F "gh version 2.89.0"
      - name: Verify certified Server OCI attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository=$(jq -er '.components["agent-remote-server"].repository' release-manifest.json)
          version=$(jq -er '.components["agent-remote-server"].version' release-manifest.json)
          workflow=$(jq -er '.components["agent-remote-server"].release_workflow' release-manifest.json)
          directory=$(mktemp -d)
          gh release download "v${version}" --repo "$repository" --dir "$directory" \
            --pattern "agent-remote-server-${version}.json" \
            --pattern "agent-remote-server-${version}.provenance.jsonl"
          metadata="$directory/agent-remote-server-${version}.json"
          bundle="$directory/agent-remote-server-${version}.provenance.jsonl"
          image=$(jq -er .image "$metadata")
          digest=$(jq -er .digest "$metadata")
          env -u GH_TOKEN -u GITHUB_TOKEN \
            gh attestation verify "oci://${image}@${digest}" \
              --repo "$repository" --bundle "$bundle" \
              --source-ref "refs/tags/v${version}" \
              --signer-workflow "${repository}/.github/workflows/${workflow}" \
              --format json | jq -e 'length > 0' >/dev/null
      - name: Validate GitHub Actions workflows
        uses: raven-actions/actionlint@v2.1.1
        with:
          flags: -config-file .github/actionlint.yaml
      - name: Verify device-control operations runbook
        run: python3 tests/device_control_operations_runbook_contract_test.py
      - name: Test release-evidence assembler
        run: python3 tests/test_assemble_device_control_release_evidence.py
      - name: Test community release-evidence assembler
        run: python3 tests/test_assemble_community_device_control_release_evidence.py
      - name: Test Community Computer Use v2 evidence collector
        run: python3 tests/test_collect_community_computer_use_v2_evidence.py
      - name: Test protected external-gate collector
        run: python3 tests/test_collect_device_control_external_gates.py
      - name: Test certified composition readiness verifier
        run: python3 tests/test_device_control_release_readiness.py
      - name: Test component composition updater
        run: python3 tests/test_update_release_component.py
      - name: Validate compose bundle
        run: docker compose --env-file deploy/compose/.env.example -f deploy/compose/docker-compose.yml config --quiet
  session-port-forwarding-e2e:
    name: session-port-forwarding-e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            e2e_args: ""
          - os: macos-14
            e2e_args: --skip-concurrency-stress
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/checkout@v7.0.0
        with:
          repository: Agent-Remote/agent-remote-cli
          path: .e2e/agent-remote-cli
      - uses: actions/checkout@v7.0.0
        with:
          repository: Agent-Remote/agent-remote-node
          path: .e2e/agent-remote-node
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: .e2e/agent-remote-node/go.mod
          cache: false
      - name: Run session port-forwarding E2E
        env:
          AGENT_REMOTE_CLI_REPO: ${{ github.workspace }}/.e2e/agent-remote-cli
          AGENT_REMOTE_NODE_REPO: ${{ github.workspace }}/.e2e/agent-remote-node
        run: scripts/run-session-port-forwarding-e2e.sh ${{ matrix.e2e_args }}

  local-device-control-e2e:
    name: local-device-control-e2e
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/checkout@v7.0.0
        with:
          repository: Agent-Remote/agent-remote-server
          path: .e2e/agent-remote-server
      - uses: actions/checkout@v7.0.0
        with:
          repository: Agent-Remote/agent-remote-node
          path: .e2e/agent-remote-node
      - uses: actions/checkout@v7.0.0
        with:
          repository: Agent-Remote/agent-remote-device
          path: .e2e/agent-remote-device
      - uses: astral-sh/setup-uv@v8.3.1
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: .e2e/agent-remote-node/go.mod
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install server test environment
        run: uv sync --project .e2e/agent-remote-server
      - name: Run local device-control E2E
        env:
          AGENT_REMOTE_SERVER_REPO: ${{ github.workspace }}/.e2e/agent-remote-server
          AGENT_REMOTE_NODE_REPO: ${{ github.workspace }}/.e2e/agent-remote-node
          AGENT_REMOTE_DEVICE_REPO: ${{ github.workspace }}/.e2e/agent-remote-device
        run: scripts/run-local-device-control-e2e.sh
