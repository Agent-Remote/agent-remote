name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        type: string

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.value }}
      server-version: ${{ steps.manifest.outputs.server-version }}
      node-version: ${{ steps.manifest.outputs.node-version }}
      cli-version: ${{ steps.manifest.outputs.cli-version }}
      admin-version: ${{ steps.manifest.outputs.admin-version }}
      admin-workflow: ${{ steps.manifest.outputs.admin-workflow }}
      device-version: ${{ steps.manifest.outputs.device-version }}
      browser-version: ${{ steps.manifest.outputs.browser-version }}
      browser-workflow: ${{ steps.manifest.outputs.browser-workflow }}
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          version="${version#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid semantic version: $version" >&2
            exit 2
          fi
          test "$GITHUB_REF" = "refs/tags/v${version}"
          test "$(tr -d '[:space:]' < VERSION)" = "$version"
          echo "value=${version}" >> "$GITHUB_OUTPUT"
      - name: Resolve certified component versions
        id: manifest
        env:
          DISTRIBUTION_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          test "$(jq -er .schema_version release-manifest.json)" = "3"
          test "$(jq -er .distribution_version release-manifest.json)" = \
            "$DISTRIBUTION_VERSION"
          if ! jq -e '
            .components["agent-remote-ego-browser"] as $browser |
            $browser.release_published == true and
            $browser.production_ready == true and
            $browser.readiness_blockers == [] and
            ($browser.signer_certificate_sha256 | test("^[0-9a-f]{64}$")) and
            ($browser.learning_bundle_digest | test("^[0-9a-f]{64}$")) and
            $browser.nested_signatures_verified == true
          ' release-manifest.json >/dev/null; then
            echo "ego-browser production release evidence is incomplete" >&2
            exit 1
          fi
          for entry in \
            server=agent-remote-server \
            node=agent-remote-node \
            cli=agent-remote-cli \
            admin=agent-remote-admin-web \
            device=agent-remote-device \
            browser=agent-remote-ego-browser; do
            output=${entry%%=*}
            component=${entry#*=}
            version=$(jq -er --arg name "$component" '.components[$name].version' release-manifest.json)
            commit=$(jq -er --arg name "$component" '.components[$name].commit' release-manifest.json)
            workflow=$(jq -er --arg name "$component" '.components[$name].release_workflow' release-manifest.json)
            test "$(jq -er --arg name "$component" '.components[$name].repository' release-manifest.json)" = \
              "Agent-Remote/${component}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]
            [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
            [[ "$workflow" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.ya?ml$ ]]
            echo "${output}-version=${version}" >> "$GITHUB_OUTPUT"
            echo "${output}-workflow=${workflow}" >> "$GITHUB_OUTPUT"
          done

  validate:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/checkout@v7.0.0
        with:
          repository: Agent-Remote/agent-remote-cli
          ref: v${{ needs.resolve.outputs.cli-version }}
          path: .e2e/agent-remote-cli
      - uses: actions/checkout@v7.0.0
        with:
          repository: Agent-Remote/agent-remote-node
          ref: v${{ needs.resolve.outputs.node-version }}
          path: .e2e/agent-remote-node
      - uses: actions/checkout@v7.0.0
        with:
          repository: Agent-Remote/agent-remote-server
          ref: v${{ needs.resolve.outputs.server-version }}
          path: .release/agent-remote-server
      - uses: actions/checkout@v7.0.0
        with:
          repository: Agent-Remote/agent-remote-admin-web
          ref: v${{ needs.resolve.outputs.admin-version }}
          path: .release/agent-remote-admin-web
      - uses: actions/checkout@v7.0.0
        with:
          repository: Agent-Remote/agent-remote-device
          ref: v${{ needs.resolve.outputs.device-version }}
          path: .release/agent-remote-device
      - uses: actions/checkout@v7.0.0
        with:
          repository: Agent-Remote/agent-remote-ego-browser
          ref: v${{ needs.resolve.outputs.browser-version }}
          path: .release/agent-remote-ego-browser
      - name: Verify certified immutable production composition
        run: |
          python3 scripts/check-device-control-release-readiness.py \
            --manifest release-manifest.json \
            --require-clean \
            --require-tag \
            --require-origin \
            --repository "agent-remote=${GITHUB_WORKSPACE}" \
            --repository "agent-remote-server=${GITHUB_WORKSPACE}/.release/agent-remote-server" \
            --repository "agent-remote-node=${GITHUB_WORKSPACE}/.e2e/agent-remote-node" \
            --repository "agent-remote-cli=${GITHUB_WORKSPACE}/.e2e/agent-remote-cli" \
            --repository "agent-remote-admin-web=${GITHUB_WORKSPACE}/.release/agent-remote-admin-web" \
            --repository "agent-remote-device=${GITHUB_WORKSPACE}/.release/agent-remote-device" \
            --repository "agent-remote-ego-browser=${GITHUB_WORKSPACE}/.release/agent-remote-ego-browser"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: tagged-session-port-forwarding
          workspaces: .e2e/agent-remote-cli -> target
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: .e2e/agent-remote-node/go.mod
          cache-dependency-path: .e2e/agent-remote-node/go.sum
      - name: Verify tagged session port forwarding
        env:
          AGENT_REMOTE_CLI_REPO: ${{ github.workspace }}/.e2e/agent-remote-cli
          AGENT_REMOTE_NODE_REPO: ${{ github.workspace }}/.e2e/agent-remote-node
        run: scripts/run-session-port-forwarding-e2e.sh

  community-evidence:
    needs: [resolve, validate]
    uses: ./.github/workflows/community-device-control-release-evidence.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      accept_reduced_security: true
    secrets: inherit

  release:
    needs: [resolve, validate, community-evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/download-artifact@v8.0.1
        with:
          name: community-device-control-release-evidence-${{ needs.resolve.outputs.version }}
          path: .release/device-control-release-evidence
      - uses: sigstore/cosign-installer@v4.0.0
      - name: Install pinned GitHub CLI
        run: bash scripts/install-github-cli.sh
      - name: Resolve immutable deployment images
        env:
          ADMIN_VERSION: ${{ needs.resolve.outputs.admin-version }}
          ADMIN_WORKFLOW: ${{ needs.resolve.outputs.admin-workflow }}
          GH_TOKEN: ${{ github.token }}
          SERVER_VERSION: ${{ needs.resolve.outputs.server-version }}
        run: |
          set -euo pipefail
          mkdir -p .release/server .release/admin
          gh release download "v${SERVER_VERSION}" \
            --repo Agent-Remote/agent-remote-server --dir .release/server \
            --pattern "agent-remote-server-${SERVER_VERSION}.json" \
            --pattern "agent-remote-server-${SERVER_VERSION}.sha256"
          gh release download "v${ADMIN_VERSION}" \
            --repo Agent-Remote/agent-remote-admin-web --dir .release/admin \
            --pattern "agent-remote-admin-web-${ADMIN_VERSION}.json" \
            --pattern "agent-remote-admin-web-${ADMIN_VERSION}.provenance.jsonl" \
            --pattern "agent-remote-admin-web-${ADMIN_VERSION}.sha256"
          (cd .release/server && sha256sum --ignore-missing --check \
            "agent-remote-server-${SERVER_VERSION}.sha256")
          (cd .release/admin && sha256sum --ignore-missing --check \
            "agent-remote-admin-web-${ADMIN_VERSION}.sha256")
          admin_image=$(jq -er .image \
            ".release/admin/agent-remote-admin-web-${ADMIN_VERSION}.json")
          admin_digest=$(jq -er .digest \
            ".release/admin/agent-remote-admin-web-${ADMIN_VERSION}.json")
          cosign verify \
            --certificate-identity \
              "https://github.com/Agent-Remote/agent-remote-admin-web/.github/workflows/${ADMIN_WORKFLOW}@refs/tags/v${ADMIN_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${admin_image}@${admin_digest}"
          env -u GH_TOKEN -u GITHUB_TOKEN \
            gh attestation verify "oci://${admin_image}@${admin_digest}" \
            --repo Agent-Remote/agent-remote-admin-web \
            --bundle ".release/admin/agent-remote-admin-web-${ADMIN_VERSION}.provenance.jsonl" \
            --source-ref "refs/tags/v${ADMIN_VERSION}" \
            --signer-workflow "Agent-Remote/agent-remote-admin-web/.github/workflows/${ADMIN_WORKFLOW}"
      - name: Build deployment bundle
        env:
          ADMIN_VERSION: ${{ needs.resolve.outputs.admin-version }}
          SERVER_VERSION: ${{ needs.resolve.outputs.server-version }}
        run: |
          set -euo pipefail
          version="${{ needs.resolve.outputs.version }}"
          package="agent-remote-deploy-${version}"
          mkdir -p "dist/${package}"
          cp -R deploy docs scripts README.md README.zh-CN.md CHANGELOG.md LICENSE THIRD_PARTY_NOTICES.md VERSION release-manifest.json "dist/${package}/"
          evidence_source=".release/device-control-release-evidence/device-control-release-evidence-${version}.json"
          manifest_sha256=$(sha256sum release-manifest.json | cut -d ' ' -f 1)
          jq -e \
            --arg distribution_version "$version" \
            --arg manifest_sha256 "$manifest_sha256" \
            '.schema_version == 9 and
             .distribution_version == $distribution_version and
             .release_manifest_sha256 == $manifest_sha256 and
             (has("expires_at") | not)' \
            "$evidence_source" >/dev/null
          cp \
            "$evidence_source" \
            "dist/${package}/deploy/compose/device-control-release-evidence.json"
          (cd ".release/device-control-release-evidence" && \
            sha256sum --check SHA256SUMS)
          (cd "dist/${package}/deploy/compose" && \
            sha256sum device-control-release-evidence.json \
              > device-control-release-evidence.SHA256SUMS)
          sed -i \
            's#^DEVICE_CONTROL_RELEASE_EVIDENCE_FILE=.*#DEVICE_CONTROL_RELEASE_EVIDENCE_FILE=./device-control-release-evidence.json#' \
            "dist/${package}/deploy/compose/.env.example"
          server_image=$(jq -er .image \
            ".release/server/agent-remote-server-${SERVER_VERSION}.json")
          server_digest=$(jq -er .digest \
            ".release/server/agent-remote-server-${SERVER_VERSION}.json")
          admin_image=$(jq -er .image \
            ".release/admin/agent-remote-admin-web-${ADMIN_VERSION}.json")
          admin_digest=$(jq -er .digest \
            ".release/admin/agent-remote-admin-web-${ADMIN_VERSION}.json")
          sed -i "s#^SERVER_IMAGE=.*#SERVER_IMAGE=${server_image}@${server_digest}#" \
            "dist/${package}/deploy/compose/.env.example"
          sed -i "s#^ADMIN_WEB_IMAGE=.*#ADMIN_WEB_IMAGE=${admin_image}@${admin_digest}#" \
            "dist/${package}/deploy/compose/.env.example"
          bridge_learning_key_id=$(jq -er \
            '.components["agent-remote-ego-browser"].learning_bundle_signing_key_id' \
            "$evidence_source")
          bridge_profile=$(jq -er \
            '.components["agent-remote-ego-browser"].profile' "$evidence_source")
          bridge_certificate=$(jq -er \
            '.components["agent-remote-ego-browser"].signer_certificate_sha256' "$evidence_source")
          bridge_version=$(jq -er \
            '.components["agent-remote-ego-browser"].version' "$evidence_source")
          bridge_skill_version=$(jq -er \
            '.components["agent-remote-ego-browser"].skill_version' "$evidence_source")
          bridge_skill_tree=$(jq -er \
            '.components["agent-remote-ego-browser"].skill_tree_sha256' "$evidence_source")
          bridge_skill_commit=$(jq -er \
            '.components["agent-remote-ego-browser"].skill_commit' "$evidence_source")
          bridge_runtime_version=$(jq -er \
            '.components["agent-remote-ego-browser"].local_ego_browser_runtime_version' "$evidence_source")
          bridge_protocol=$(jq -er \
            '.components["agent-remote-ego-browser"].protocol_version' "$evidence_source")
          bridge_learning_digest=$(jq -er .ego_browser_learning_bundle_sha256 "$evidence_source")
          bridge_manifest_digest=$(jq -er .ego_browser_release_manifest_sha256 "$evidence_source")
          bridge_archive_digest=$(jq -er .ego_browser_release_archive_sha256 "$evidence_source")
          bridge_signing_digest=$(jq -er .ego_browser_signing_evidence_sha256 "$evidence_source")
          bridge_sigstore_digest=$(jq -er .ego_browser_sigstore_sha256 "$evidence_source")
          bridge_provenance_digest=$(jq -er .ego_browser_provenance_sha256 "$evidence_source")
          sed -i \
            -e "s#^EGO_BROWSER_EXPECTED_RELEASE_PROFILE=.*#EGO_BROWSER_EXPECTED_RELEASE_PROFILE=${bridge_profile}#" \
            -e "s#^EGO_BROWSER_EXPECTED_SIGNER_CERTIFICATE_SHA256=.*#EGO_BROWSER_EXPECTED_SIGNER_CERTIFICATE_SHA256=${bridge_certificate}#" \
            -e "s#^EGO_BROWSER_EXPECTED_WRAPPER_VERSION=.*#EGO_BROWSER_EXPECTED_WRAPPER_VERSION=${bridge_version}#" \
            -e "s#^EGO_BROWSER_EXPECTED_SKILL_VERSION=.*#EGO_BROWSER_EXPECTED_SKILL_VERSION=${bridge_skill_version}#" \
            -e "s#^EGO_BROWSER_EXPECTED_SKILL_TREE_SHA256=.*#EGO_BROWSER_EXPECTED_SKILL_TREE_SHA256=${bridge_skill_tree}#" \
            -e "s#^EGO_BROWSER_EXPECTED_SKILL_COMMIT=.*#EGO_BROWSER_EXPECTED_SKILL_COMMIT=${bridge_skill_commit}#" \
            -e "s#^EGO_BROWSER_EXPECTED_LOCAL_RUNTIME_VERSION=.*#EGO_BROWSER_EXPECTED_LOCAL_RUNTIME_VERSION=${bridge_runtime_version}#" \
            -e "s#^EGO_BROWSER_EXPECTED_PROTOCOL_VERSION=.*#EGO_BROWSER_EXPECTED_PROTOCOL_VERSION=${bridge_protocol}#" \
            -e "s#^EGO_BROWSER_EXPECTED_LEARNING_BUNDLE_SIGNING_KEY_ID=.*#EGO_BROWSER_EXPECTED_LEARNING_BUNDLE_SIGNING_KEY_ID=${bridge_learning_key_id}#" \
            -e "s#^EGO_BROWSER_EXPECTED_LEARNING_BUNDLE_SHA256=.*#EGO_BROWSER_EXPECTED_LEARNING_BUNDLE_SHA256=${bridge_learning_digest}#" \
            -e "s#^EGO_BROWSER_EXPECTED_DISTRIBUTION_VERSION=.*#EGO_BROWSER_EXPECTED_DISTRIBUTION_VERSION=${version}#" \
            -e "s#^EGO_BROWSER_EXPECTED_ROOT_MANIFEST_SHA256=.*#EGO_BROWSER_EXPECTED_ROOT_MANIFEST_SHA256=${manifest_sha256}#" \
            -e "s#^EGO_BROWSER_EXPECTED_BRIDGE_RELEASE_MANIFEST_SHA256=.*#EGO_BROWSER_EXPECTED_BRIDGE_RELEASE_MANIFEST_SHA256=${bridge_manifest_digest}#" \
            -e "s#^EGO_BROWSER_EXPECTED_BRIDGE_RELEASE_ARCHIVE_SHA256=.*#EGO_BROWSER_EXPECTED_BRIDGE_RELEASE_ARCHIVE_SHA256=${bridge_archive_digest}#" \
            -e "s#^EGO_BROWSER_EXPECTED_BRIDGE_SIGNING_EVIDENCE_SHA256=.*#EGO_BROWSER_EXPECTED_BRIDGE_SIGNING_EVIDENCE_SHA256=${bridge_signing_digest}#" \
            -e "s#^EGO_BROWSER_EXPECTED_BRIDGE_SIGSTORE_SHA256=.*#EGO_BROWSER_EXPECTED_BRIDGE_SIGSTORE_SHA256=${bridge_sigstore_digest}#" \
            -e "s#^EGO_BROWSER_EXPECTED_BRIDGE_PROVENANCE_SHA256=.*#EGO_BROWSER_EXPECTED_BRIDGE_PROVENANCE_SHA256=${bridge_provenance_digest}#" \
            "dist/${package}/deploy/compose/.env.example"
          jq \
            --arg server_image "${server_image}@${server_digest}" \
            --arg admin_image "${admin_image}@${admin_digest}" \
            '.components["agent-remote-server"].image = $server_image |
             .components["agent-remote-admin-web"].image = $admin_image' \
            release-manifest.json > "dist/${package}/production-release-manifest.json"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          (cd dist && sha256sum "${package}.tar.gz" > "${package}.tar.gz.sha256")
      - name: Generate deployment bundle SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist/agent-remote-deploy-${{ needs.resolve.outputs.version }}
          format: spdx-json
          output-file: dist/agent-remote-deploy-${{ needs.resolve.outputs.version }}.spdx.json
      - uses: sigstore/cosign-installer@v4.0.0
      - name: Sign and verify deployment bundle
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          archive="dist/agent-remote-deploy-${VERSION}.tar.gz"
          (cd dist && sha256sum --check "agent-remote-deploy-${VERSION}.tar.gz.sha256")
          cosign sign-blob --yes --bundle "$archive.sigstore.json" "$archive"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
      - name: Attest deployment bundle provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/agent-remote-deploy-${{ needs.resolve.outputs.version }}.tar.gz
      - name: Verify deployment bundle provenance
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: gh attestation verify "dist/agent-remote-deploy-${VERSION}.tar.gz" --repo "$GITHUB_REPOSITORY"
      - uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: v${{ needs.resolve.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.tar.gz.sigstore.json
            dist/*.spdx.json
