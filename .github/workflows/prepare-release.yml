name: prepare-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - name: Normalize version
        id: version
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          version="${version#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: ${{ inputs.version }}" >&2
            exit 2
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "Tag v${version} already exists" >&2
            exit 1
          fi
          echo "value=${version}" >> "$GITHUB_OUTPUT"
      - name: Prepare version files
        run: scripts/prepare-release.sh "${{ steps.version.outputs.value }}"
      - name: Validate compose bundle
        run: docker compose --env-file deploy/compose/.env.example -f deploy/compose/docker-compose.yml config --quiet
      - name: Commit and tag
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add \
              CHANGELOG.md \
              VERSION \
              release-manifest.json \
              deploy/compose/.env.device-test \
              docs/deployment.md \
              docs/local-device-control-test-release.md \
              scripts/prepare-release.sh
            git commit -m "chore: release v${version}"
          fi
          git diff --exit-code
          git tag "v${version}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "v${version}"
          release_commit=$(git rev-parse HEAD)
          for attempt in 1 2 3; do
            if gh workflow run release.yml --ref "v${version}" -f version="${version}"; then
              exit 0
            fi
            sleep 3
            if gh run list --workflow release.yml --event workflow_dispatch \
              --commit "$release_commit" --limit 10 --json databaseId \
              --jq 'length > 0' | grep -qx true; then
              echo "Release workflow was created despite a dispatch API error"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 3))
            fi
          done
          echo "Failed to dispatch release workflow" >&2
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
