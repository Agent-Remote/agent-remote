name: community-device-control-release-evidence

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact root distribution version without a v prefix
        required: true
        type: string
      accept_reduced_security:
        description: Accept the documented community-local-trust residual risks
        required: true
        type: boolean
      computer_use_v2_run_id:
        description: Optional successful Community v2 evidence workflow run ID
        required: false
        type: string
        default: ""
      computer_use_v2_target:
        description: Linux target exercised by the optional Community v2 evidence
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      version:
        description: Exact root distribution version without a v prefix
        required: true
        type: string
      accept_reduced_security:
        description: Accept the documented community-local-trust residual risks
        required: true
        type: boolean
      computer_use_v2_run_id:
        description: Optional successful Community v2 evidence workflow run ID
        required: false
        type: string
        default: ""
      computer_use_v2_target:
        description: Linux target exercised by the optional Community v2 evidence
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: community-device-control-release-evidence-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-device-release-evidence
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Resolve immutable production composition
        id: manifest
        env:
          ACCEPTED: ${{ inputs.accept_reduced_security }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$ACCEPTED" = "true"
          test "$GITHUB_REF" = "refs/tags/v${VERSION}"
          test "$(tr -d '[:space:]' < VERSION)" = "$VERSION"
          python3 scripts/export-release-manifest.py \
            --manifest release-manifest.json \
            --expected-distribution-version "$VERSION" \
            --github-env "$GITHUB_ENV" \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7.0.0
        with:
          repository: Agent-Remote/agent-remote-server
          ref: v${{ steps.manifest.outputs.server-version }}
          path: release-input/server-source
      - uses: actions/checkout@v7.0.0
        with:
          repository: Agent-Remote/agent-remote-ego-browser
          ref: v${{ steps.manifest.outputs.browser-version }}
          path: release-input/ego-browser-source
      - uses: astral-sh/setup-uv@v8.3.1
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: sigstore/cosign-installer@v4.0.0
      - name: Install pinned GitHub CLI
        run: bash scripts/install-github-cli.sh
      - name: Download exact certified component artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-input/server release-input/node release-input/device \
            release-input/cli release-input/admin release-input/ego-browser
          BROWSER_CERTIFICATE_SHA256=$(jq -er \
            '.components["agent-remote-ego-browser"].signer_certificate_sha256' \
            release-manifest.json)
          BROWSER_LEARNING_BUNDLE_DIGEST=$(jq -er \
            '.components["agent-remote-ego-browser"].learning_bundle_digest' \
            release-manifest.json)
          BROWSER_LEARNING_BUNDLE_KEY_ID=$(jq -er \
            '.components["agent-remote-ego-browser"].learning_bundle_signing_key_id' \
            release-manifest.json)
          [[ "$BROWSER_CERTIFICATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$BROWSER_LEARNING_BUNDLE_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$BROWSER_LEARNING_BUNDLE_KEY_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          {
            echo "BROWSER_CERTIFICATE_SHA256=$BROWSER_CERTIFICATE_SHA256"
            echo "BROWSER_LEARNING_BUNDLE_DIGEST=$BROWSER_LEARNING_BUNDLE_DIGEST"
            echo "BROWSER_LEARNING_BUNDLE_KEY_ID=$BROWSER_LEARNING_BUNDLE_KEY_ID"
          } >> "$GITHUB_ENV"
          gh release download "v${SERVER_VERSION}" --repo Agent-Remote/agent-remote-server \
            --dir release-input/server
          targets=(linux-amd64-glibc linux-arm64-glibc linux-amd64-musl linux-arm64-musl)
          node_patterns=(
            --pattern "agent-remote-node-${NODE_VERSION}.spdx.json*"
            --pattern "agent-remote-node-${NODE_VERSION}.govulncheck.json*"
          )
          device_patterns=(
            --pattern "agent-remote-device-macos-${DEVICE_VERSION}.*"
            --pattern "agent-remote-device-${DEVICE_VERSION}.cargo-audit.json*"
            --pattern "agent-remote-device-${DEVICE_VERSION}.swift-osv.json*"
          )
          for target in "${targets[@]}"; do
            node_patterns+=(
              --pattern "agent-remote-node-${NODE_VERSION}-${target}.tar.gz"
              --pattern "agent-remote-node-${NODE_VERSION}-${target}.tar.gz.sha256"
              --pattern "agent-remote-node-${NODE_VERSION}-${target}.tar.gz.sigstore.json"
            )
            device_patterns+=(--pattern "agent-remote-device-proxy-${target}-${DEVICE_VERSION}.*")
          done
          gh release download "v${NODE_VERSION}" --repo Agent-Remote/agent-remote-node \
            --dir release-input/node "${node_patterns[@]}"
          gh release download "v${DEVICE_VERSION}" --repo Agent-Remote/agent-remote-device \
            --dir release-input/device "${device_patterns[@]}"
          gh release download "v${CLI_VERSION}" --repo Agent-Remote/agent-remote-cli \
            --dir release-input/cli \
            --pattern "agent-remote-cli-${CLI_VERSION}.cargo-audit.json*"
          gh release download "v${ADMIN_VERSION}" --repo Agent-Remote/agent-remote-admin-web \
            --dir release-input/admin \
            --pattern "agent-remote-admin-web-${ADMIN_VERSION}.npm-audit.json*"
          browser=release-input/ego-browser
          browser_patterns=(
            --pattern "agent-remote-ego-browser-${BROWSER_VERSION}.release-manifest.json"
            --pattern "agent-remote-ego-browser-${BROWSER_VERSION}.release-manifest.json.sha256"
            --pattern "agent-remote-ego-browser-${BROWSER_VERSION}.release-manifest.json.sigstore.json"
            --pattern "agent-remote-ego-browser-macos-universal-${BROWSER_VERSION}.tar.gz"
            --pattern "agent-remote-ego-browser-macos-universal-${BROWSER_VERSION}.tar.gz.sha256"
            --pattern "agent-remote-ego-browser-macos-universal-${BROWSER_VERSION}.tar.gz.sigstore.json"
            --pattern "agent-remote-ego-browser-macos-universal-${BROWSER_VERSION}.community-signing.json"
            --pattern "agent-remote-ego-browser-macos-universal-${BROWSER_VERSION}.community-signing.json.sha256"
            --pattern "agent-remote-ego-browser-macos-universal-${BROWSER_VERSION}.community-signing.json.sigstore.json"
            --pattern "agent-remote-ego-browser-${BROWSER_VERSION}.cargo-audit.json"
            --pattern "agent-remote-ego-browser-${BROWSER_VERSION}.cargo-audit.json.sha256"
            --pattern "agent-remote-ego-browser-${BROWSER_VERSION}.cargo-audit.json.sigstore.json"
          )
          for label in linux-amd64-glibc linux-arm64-glibc linux-amd64-musl linux-arm64-musl; do
            archive="agent-remote-ego-browser-wrapper-${label}-${BROWSER_VERSION}.tar.gz"
            sbom="agent-remote-ego-browser-wrapper-${label}-${BROWSER_VERSION}.spdx.json"
            browser_patterns+=(
              --pattern "$archive"
              --pattern "$archive.sha256"
              --pattern "$archive.sigstore.json"
              --pattern "$sbom"
              --pattern "$sbom.sigstore.json"
            )
          done
          browser_patterns+=(
            --pattern "agent-remote-ego-browser-macos-universal-${BROWSER_VERSION}.spdx.json"
            --pattern "agent-remote-ego-browser-macos-universal-${BROWSER_VERSION}.spdx.json.sigstore.json"
          )
          gh release download "v${BROWSER_VERSION}" \
            --repo Agent-Remote/agent-remote-ego-browser --dir "$browser" \
            "${browser_patterns[@]}"
      - name: Verify exact ego-browser Bridge release and learning bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          browser=release-input/ego-browser
          source=release-input/ego-browser-source
          manifest="$browser/agent-remote-ego-browser-${BROWSER_VERSION}.release-manifest.json"
          archive="$browser/agent-remote-ego-browser-macos-universal-${BROWSER_VERSION}.tar.gz"
          signing="$browser/agent-remote-ego-browser-macos-universal-${BROWSER_VERSION}.community-signing.json"
          browser_release=$(gh release view "v${BROWSER_VERSION}" \
            --repo Agent-Remote/agent-remote-ego-browser \
            --json tagName,isDraft,isPrerelease,publishedAt)
          jq -e --arg tag "v${BROWSER_VERSION}" \
            '.tagName == $tag and .isDraft == false and .isPrerelease == false and
             (.publishedAt | type == "string" and length > 0)' \
            <<<"$browser_release" >/dev/null
          (cd "$browser" && sha256sum --check "$(basename "$manifest").sha256")
          (cd "$browser" && sha256sum --check "$(basename "$archive").sha256")
          (cd "$browser" && sha256sum --check "$(basename "$signing").sha256")
          while IFS= read -r -d '' checksum; do
            (cd "$browser" && sha256sum --check "$(basename "$checksum")")
          done < <(find "$browser" -maxdepth 1 -type f -name '*.sha256' -print0 | sort -z)
          test "$(git -C "$source" rev-parse HEAD)" = "$BROWSER_COMMIT"
          test "$(git -C "$source" rev-parse --verify "refs/tags/v${BROWSER_VERSION}^{commit}")" = "$BROWSER_COMMIT"
          python3 "$source/scripts/release_manifest.py" verify \
            --manifest "$manifest" --artifact-dir "$browser" \
            --expected-version "$BROWSER_VERSION" \
            --expected-certificate-sha256 "$BROWSER_CERTIFICATE_SHA256" >/dev/null
          jq -e \
            --arg digest "$BROWSER_LEARNING_BUNDLE_DIGEST" \
            --arg key "$BROWSER_LEARNING_BUNDLE_KEY_ID" \
            '.production_ready == true and .readiness_blockers == [] and
             .nested_signatures_verified == true and
             .learning_bundle_digest == $digest and
             .learning_bundle_signing_key_id == $key' \
            "$manifest" >/dev/null
          jq -e \
            --arg version "$BROWSER_VERSION" \
            --arg cert "$BROWSER_CERTIFICATE_SHA256" \
            '.schema_version == 1 and .version == $version and
             .production_ready == true and .readiness_blockers == [] and
             .signer_certificate_sha256 == $cert and
             .nested_signatures_verified == true and
             .learning_bundle_digest == env.BROWSER_LEARNING_BUNDLE_DIGEST and
             .learning_bundle_signing_key_id == env.BROWSER_LEARNING_BUNDLE_KEY_ID' \
            "$signing" >/dev/null
          verify_blob() {
            local path=$1 workflow=$2
            cosign verify-blob --bundle "$path.sigstore.json" \
              --certificate-identity \
                "https://github.com/Agent-Remote/agent-remote-ego-browser/.github/workflows/${workflow}@refs/tags/v${BROWSER_VERSION}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$path"
          }
          verify_blob "$archive" "$BROWSER_WORKFLOW"
          verify_blob "$manifest" "$BROWSER_WORKFLOW"
          verify_blob "$signing" "$BROWSER_WORKFLOW"
          verify_blob "$browser/agent-remote-ego-browser-${BROWSER_VERSION}.cargo-audit.json" "$BROWSER_WORKFLOW"
          jq -r '.artifacts[] | [.name, .sbom] | @tsv' "$manifest" |
            while IFS=$'\t' read -r artifact sbom; do
              verify_blob "$browser/$artifact" "$BROWSER_WORKFLOW"
              jq -e '.spdxVersion | startswith("SPDX-")' "$browser/$sbom" >/dev/null
              verify_blob "$browser/$sbom" "$BROWSER_WORKFLOW"
            done
          gh attestation verify "$archive" \
            --repo Agent-Remote/agent-remote-ego-browser \
            --source-ref "refs/tags/v${BROWSER_VERSION}" \
            --signer-workflow "Agent-Remote/agent-remote-ego-browser/.github/workflows/${BROWSER_WORKFLOW}" \
            --format json > "$browser/provenance.json"
          gh attestation verify "$manifest" \
            --repo Agent-Remote/agent-remote-ego-browser \
            --source-ref "refs/tags/v${BROWSER_VERSION}" \
            --signer-workflow "Agent-Remote/agent-remote-ego-browser/.github/workflows/${BROWSER_WORKFLOW}" \
            --format json > "$browser/manifest-provenance.json"
          if [ -e "$browser/learning-bundle" ] || [ -L "$browser/learning-bundle" ]; then
            rm -rf -- "$browser/learning-bundle"
          fi
          learning_archive="$RUNNER_TEMP/ego-browser-learning-bundle.tar.gz"
          python3 - "$archive" "$learning_archive" <<'PY'
          import copy
          import posixpath
          import sys
          import tarfile

          source_path, output_path = sys.argv[1:]
          maximum_members = 4096
          maximum_bytes = 256 * 1024 * 1024
          selected = []
          names = set()
          expanded = 0
          with tarfile.open(source_path, mode="r:gz") as source:
              for original in source.getmembers():
                  name = original.name.rstrip("/")
                  if name != "learning-bundle" and not name.startswith("learning-bundle/"):
                      continue
                  if (
                      not name
                      or "\x00" in name
                      or "\\" in name
                      or name.startswith("/")
                      or posixpath.normpath(name) != name
                      or name in names
                  ):
                      raise SystemExit("unsafe learning-bundle member")
                  names.add(name)
                  if not (original.isdir() or original.isfile()):
                      raise SystemExit("learning-bundle contains a link or special file")
                  if original.size < 0 or original.size > 64 * 1024 * 1024:
                      raise SystemExit("learning-bundle member is oversized")
                  expanded += original.size
                  if len(selected) >= maximum_members or expanded > maximum_bytes:
                      raise SystemExit("learning-bundle exceeds extraction limits")
                  member = copy.copy(original)
                  member.name = name
                  selected.append((member, original))
              required = {"learning-bundle", "learning-bundle/manifest.json", "learning-bundle/learnings"}
              if not required.issubset(names):
                  raise SystemExit("learning-bundle tree is incomplete")
              with tarfile.open(output_path, mode="w:gz") as output:
                  for member, original in selected:
                      if member.isfile():
                          payload = source.extractfile(original)
                          if payload is None:
                              raise SystemExit("learning-bundle member cannot be read")
                          with payload:
                              output.addfile(member, payload)
                      else:
                          output.addfile(member)
          PY
          python3 "$source/scripts/extract-learning-bundle.py" \
            --archive "$learning_archive" \
            --output "$GITHUB_WORKSPACE/$browser/learning-bundle"
          cargo build --locked --release --manifest-path "$source/Cargo.toml" \
            -p ego-browser-bridge-protocol --bin ego-browser-learning-bundle
          verifier="$source/target/release/ego-browser-learning-bundle"
          verified=$("$verifier" verify \
            --bundle "$GITHUB_WORKSPACE/$browser/learning-bundle" | tr -d '[:space:]')
          test "$verified" = "sha256:${BROWSER_LEARNING_BUNDLE_DIGEST}"
      - name: Verify release checksums, signatures, provenance, and vulnerability reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          server=release-input/server
          node=release-input/node
          device=release-input/device
          cli=release-input/cli
          admin=release-input/admin
          app_archive="agent-remote-device-macos-${DEVICE_VERSION}.zip"
          community="agent-remote-device-macos-${DEVICE_VERSION}.community-signing.json"

          (cd "$server" && sha256sum --check "agent-remote-server-${SERVER_VERSION}.sha256")
          (cd "$device" && sha256sum --check "$app_archive.sha256")
          (cd "$device" && sha256sum --check "$community.sha256")

          verify_blob() {
            local repository=$1
            local workflow=$2
            local version=$3
            local path=$4
            cosign verify-blob \
              --bundle "$path.sigstore.json" \
              --certificate-identity \
                "https://github.com/$repository/.github/workflows/$workflow@refs/tags/v${version}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$path"
          }
          verify_blob Agent-Remote/agent-remote-device "$DEVICE_WORKFLOW" "$DEVICE_VERSION" "$device/$app_archive"
          verify_blob Agent-Remote/agent-remote-device "$DEVICE_WORKFLOW" "$DEVICE_VERSION" "$device/$community"
          verify_blob Agent-Remote/agent-remote-server "$SERVER_WORKFLOW" "$SERVER_VERSION" \
            "$server/agent-remote-server-${SERVER_VERSION}.pip-audit.json"
          (cd "$node" && sha256sum --check \
            "agent-remote-node-${NODE_VERSION}.govulncheck.json.sha256")
          verify_blob Agent-Remote/agent-remote-node "$NODE_WORKFLOW" "$NODE_VERSION" \
            "$node/agent-remote-node-${NODE_VERSION}.govulncheck.json"
          (cd "$device" && sha256sum --check \
            "agent-remote-device-${DEVICE_VERSION}.cargo-audit.json.sha256")
          (cd "$device" && sha256sum --check \
            "agent-remote-device-${DEVICE_VERSION}.swift-osv.json.sha256")
          verify_blob Agent-Remote/agent-remote-device "$DEVICE_WORKFLOW" "$DEVICE_VERSION" \
            "$device/agent-remote-device-${DEVICE_VERSION}.cargo-audit.json"
          verify_blob Agent-Remote/agent-remote-device "$DEVICE_WORKFLOW" "$DEVICE_VERSION" \
            "$device/agent-remote-device-${DEVICE_VERSION}.swift-osv.json"
          (cd "$cli" && sha256sum --check \
            "agent-remote-cli-${CLI_VERSION}.cargo-audit.json.sha256")
          verify_blob Agent-Remote/agent-remote-cli "$CLI_WORKFLOW" "$CLI_VERSION" \
            "$cli/agent-remote-cli-${CLI_VERSION}.cargo-audit.json"
          verify_blob Agent-Remote/agent-remote-admin-web "$ADMIN_WORKFLOW" "$ADMIN_VERSION" \
            "$admin/agent-remote-admin-web-${ADMIN_VERSION}.npm-audit.json"
          for entry in \
            "Agent-Remote/agent-remote-server $SERVER_WORKFLOW $SERVER_VERSION $server/agent-remote-server-${SERVER_VERSION}.spdx.json" \
            "Agent-Remote/agent-remote-node $NODE_WORKFLOW $NODE_VERSION $node/agent-remote-node-${NODE_VERSION}.spdx.json" \
            "Agent-Remote/agent-remote-device $DEVICE_WORKFLOW $DEVICE_VERSION $device/agent-remote-device-macos-${DEVICE_VERSION}.spdx.json"; do
            read -r repository workflow version path <<<"$entry"
            jq -e '.spdxVersion | startswith("SPDX-")' "$path" >/dev/null
            verify_blob "$repository" "$workflow" "$version" "$path"
          done

          jq -e \
            '.schema_version == 1 and .release_version == env.DEVICE_VERSION and
             .profile == "community-local-trust" and .production_ready == true and
             .apple_notarized == false and .public_distribution == false and
             .signing_type == "project-self-signed" and
             .application_signature_verified == true and
             .nested_signatures_verified == true and .hardened_runtime == true' \
            "$device/$community" >/dev/null

          gh attestation verify "$device/$app_archive" \
            --repo Agent-Remote/agent-remote-device --source-ref "refs/tags/v${DEVICE_VERSION}" \
            --signer-workflow "Agent-Remote/agent-remote-device/.github/workflows/${DEVICE_WORKFLOW}" \
            --format json > release-input/application-provenance.json
          targets=(linux-amd64-glibc linux-arm64-glibc linux-amd64-musl linux-arm64-musl)
          for target in "${targets[@]}"; do
            node_archive="agent-remote-node-${NODE_VERSION}-${target}.tar.gz"
            proxy_archive="agent-remote-device-proxy-${target}-${DEVICE_VERSION}.tar.gz"
            proxy_sbom="agent-remote-device-proxy-${target}-${DEVICE_VERSION}.spdx.json"
            (cd "$node" && sha256sum --check "$node_archive.sha256")
            (cd "$device" && sha256sum --check "$proxy_archive.sha256")
            embedded_proxy_version=$(tar -xOf "$node/$node_archive" \
              "agent-remote-node-${NODE_VERSION}-linux-${target#linux-}/device/VERSION")
            test "$embedded_proxy_version" = "$DEVICE_VERSION"
            verify_blob Agent-Remote/agent-remote-node "$NODE_WORKFLOW" "$NODE_VERSION" "$node/$node_archive"
            verify_blob Agent-Remote/agent-remote-device "$DEVICE_WORKFLOW" "$DEVICE_VERSION" "$device/$proxy_archive"
            jq -e '.spdxVersion | startswith("SPDX-")' "$device/$proxy_sbom" >/dev/null
            verify_blob Agent-Remote/agent-remote-device "$DEVICE_WORKFLOW" "$DEVICE_VERSION" "$device/$proxy_sbom"
            gh attestation verify "$node/$node_archive" \
              --repo Agent-Remote/agent-remote-node --source-ref "refs/tags/v${NODE_VERSION}" \
              --signer-workflow "Agent-Remote/agent-remote-node/.github/workflows/${NODE_WORKFLOW}" \
              --format json > "release-input/node-provenance-${target}.json"
            gh attestation verify "$device/$proxy_archive" \
              --repo Agent-Remote/agent-remote-device --source-ref "refs/tags/v${DEVICE_VERSION}" \
              --signer-workflow "Agent-Remote/agent-remote-device/.github/workflows/${DEVICE_WORKFLOW}" \
              --format json > "release-input/proxy-provenance-${target}.json"
          done

          server_image=$(jq -er .image "$server/agent-remote-server-${SERVER_VERSION}.json")
          server_digest=$(jq -er .digest "$server/agent-remote-server-${SERVER_VERSION}.json")
          cosign verify \
            --certificate-identity \
              "https://github.com/Agent-Remote/agent-remote-server/.github/workflows/${SERVER_WORKFLOW}@refs/tags/v${SERVER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${server_image}@${server_digest}"
          env -u GH_TOKEN -u GITHUB_TOKEN \
            gh attestation verify "oci://${server_image}@${server_digest}" \
            --repo Agent-Remote/agent-remote-server \
            --bundle "$server/agent-remote-server-${SERVER_VERSION}.provenance.jsonl" \
            --source-ref "refs/tags/v${SERVER_VERSION}" \
            --signer-workflow "Agent-Remote/agent-remote-server/.github/workflows/${SERVER_WORKFLOW}" \
            --format json > release-input/server-provenance.json

          jq -e '(.dependencies | length) > 0 and all(.dependencies[]; (.vulns | length) == 0)' \
            "$server/agent-remote-server-${SERVER_VERSION}.pip-audit.json" >/dev/null
          jq -s -e 'any(.[]; has("finding")) | not' \
            "$node/agent-remote-node-${NODE_VERSION}.govulncheck.json" >/dev/null
          jq -e '.vulnerabilities.found == false' \
            "$device/agent-remote-device-${DEVICE_VERSION}.cargo-audit.json" >/dev/null
          jq -e '.vulnerability_ids == []' \
            "$device/agent-remote-device-${DEVICE_VERSION}.swift-osv.json" >/dev/null
          jq -e '.vulnerabilities.found == false' \
            "$cli/agent-remote-cli-${CLI_VERSION}.cargo-audit.json" >/dev/null
          jq -e \
            '.metadata.vulnerabilities.high == 0 and .metadata.vulnerabilities.critical == 0' \
            "$admin/agent-remote-admin-web-${ADMIN_VERSION}.npm-audit.json" >/dev/null
      - name: Verify successful official-runner automation for certified source commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-input/community
          python3 - <<'PY'
          import json, os, subprocess, time
          repositories = [
              "agent-remote", "agent-remote-server", "agent-remote-node",
              "agent-remote-cli", "agent-remote-admin-web", "agent-remote-device",
              "agent-remote-ego-browser",
          ]
          result = {}
          with open("release-manifest.json", encoding="utf-8") as source:
              manifest = json.load(source)
          identities = {
              "agent-remote": {
                  "version": manifest["distribution_version"],
                  "commit": os.environ["GITHUB_SHA"],
                  "release_workflow": "release.yml",
              },
              **{
                  name: {
                      "version": item["version"],
                      "commit": item["commit"],
                      "release_workflow": item["release_workflow"],
                  }
                  for name, item in manifest["components"].items()
              },
          }
          current_run = json.loads(subprocess.check_output([
              "gh", "api",
              f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          ], text=True))
          for repository in repositories:
              identity = identities[repository]
              sha = subprocess.check_output([
                  "gh", "api",
                  f"repos/Agent-Remote/{repository}/commits/v{identity['version']}",
                  "--jq", ".sha",
              ], text=True).strip()
              if sha != identity["commit"]:
                  raise SystemExit(
                      f"tag does not match certified commit for {repository}"
                  )
              trusted_release = f".github/workflows/{identity['release_workflow']}"
              runs = []
              if (
                  repository == "agent-remote"
                  and current_run["path"] == ".github/workflows/release.yml"
              ):
                  if (
                      current_run["id"] != int(os.environ["GITHUB_RUN_ID"])
                      or current_run["head_sha"] != sha
                      or current_run["event"] not in {"push", "workflow_dispatch"}
                      or current_run["status"] != "in_progress"
                      or current_run["conclusion"] is not None
                  ):
                      raise SystemExit("current distribution release run is not trusted")
                  runs = [current_run]
              else:
                  for attempt in range(40):
                      raw = subprocess.check_output([
                          "gh", "api",
                          f"repos/Agent-Remote/{repository}/actions/runs?head_sha={sha}&status=success&per_page=100",
                      ], text=True)
                      runs = [
                          run for run in json.loads(raw)["workflow_runs"]
                          if run["conclusion"] == "success" and (
                              (
                                  run["event"] == "push"
                                  and run["path"] == ".github/workflows/ci.yml"
                              )
                              or (
                                  run["event"] == "workflow_dispatch"
                                  and run["path"] == trusted_release
                              )
                          )
                      ]
                      if runs:
                          break
                      if attempt < 39:
                          time.sleep(30)
              if not runs:
                  raise SystemExit(
                      f"missing successful official-runner automation for {repository}@{sha}"
                  )
              result[repository] = {
                  "sha": sha,
                  "url": runs[0]["html_url"],
                  "conclusion": "success",
              }
          with open("release-input/community/ci-runs.json", "w", encoding="utf-8") as output:
              json.dump(result, output, sort_keys=True)
          PY
      - name: Download optional trusted Community Computer Use v2 evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.computer_use_v2_run_id }}
          TARGET: ${{ inputs.computer_use_v2_target }}
        run: |
          set -euo pipefail
          if { [ -n "$RUN_ID" ] && [ -z "$TARGET" ]; } || \
             { [ -z "$RUN_ID" ] && [ -n "$TARGET" ]; }; then
            echo "Community v2 run ID and target must be provided together" >&2
            exit 1
          fi
          if [ -z "$RUN_ID" ]; then
            exit 0
          fi
          case "$RUN_ID" in
            *[!0-9]*) echo "Community v2 run ID must be numeric" >&2; exit 1 ;;
          esac
          case "$TARGET" in
            linux-amd64-glibc|linux-arm64-glibc|linux-amd64-musl|linux-arm64-musl) ;;
            *) echo "unsupported Community v2 target: $TARGET" >&2; exit 1 ;;
          esac
          run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/v${DISTRIBUTION_VERSION}" --jq .sha)
          jq -e \
            --arg sha "$tag_sha" \
            '.conclusion == "success" and .event == "workflow_dispatch" and
             .path == ".github/workflows/community-computer-use-v2-evidence.yml" and
             .head_sha == $sha' <<<"$run" >/dev/null
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "community-computer-use-v2-evidence-${DISTRIBUTION_VERSION}" \
            --dir release-input/community-v2
      - name: Assemble and sign community production evidence
        env:
          ACTOR: ${{ github.actor }}
          COMPUTER_USE_V2_RUN_ID: ${{ inputs.computer_use_v2_run_id }}
          COMPUTER_USE_V2_TARGET: ${{ inputs.computer_use_v2_target }}
          PRIVATE_KEY_PEM: ${{ secrets.DEVICE_CONTROL_RELEASE_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          issued_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          community=release-input/community
          jq -n \
            --arg version "$DISTRIBUTION_VERSION" \
            --slurpfile ci_runs "$community/ci-runs.json" \
            '{schema_version:1,release_version:$version,profile:"community-local-trust",production_ready:true,official_runners_only:true,critical_high_vulnerabilities:0,checks:{certified_composition:true,protocol_tests:true,cross_component_e2e:true,fuzz:true,stop_revocation:true,compatibility:true,supply_chain:true},ci_runs:$ci_runs[0]}' \
            > "$community/automation.json"
          accepted_risks='["apple_notarization_absent","manual_gatekeeper_trust","system_network_filter_absent","independent_security_review_absent"]'
          if [ -n "$COMPUTER_USE_V2_RUN_ID" ]; then
            accepted_risks=$(jq -c \
              '. + ["community_computer_use_v2_without_apple_notarization"]' \
              <<<"$accepted_risks")
          fi
          jq -n \
            --arg actor "$ACTOR" --arg accepted_at "$issued_at" --arg version "$DISTRIBUTION_VERSION" \
            --argjson accepted_risks "$accepted_risks" \
            '{schema_version:1,release_version:$version,profile:"community-local-trust",accepted:true,accepted_by:$actor,accepted_at:$accepted_at,accepted_risks:$accepted_risks}' \
            > "$community/risk-acceptance.json"

          arguments=(python3 scripts/assemble-community-device-control-release-evidence.py \
            --release-version "$SERVER_VERSION" \
            --distribution-version "$DISTRIBUTION_VERSION" \
            --release-manifest release-manifest.json \
            --server-metadata "release-input/server/agent-remote-server-${SERVER_VERSION}.json" \
            --application-artifact "release-input/device/agent-remote-device-macos-${DEVICE_VERSION}.zip" \
            --sbom "server=release-input/server/agent-remote-server-${SERVER_VERSION}.spdx.json" \
            --sbom "application=release-input/device/agent-remote-device-macos-${DEVICE_VERSION}.spdx.json" \
            --provenance server=release-input/server-provenance.json \
            --provenance application=release-input/application-provenance.json \
            --community-signing "release-input/device/agent-remote-device-macos-${DEVICE_VERSION}.community-signing.json" \
            --ego-browser-repository "$GITHUB_WORKSPACE/release-input/ego-browser-source" \
            --ego-browser-release-manifest "release-input/ego-browser/agent-remote-ego-browser-${BROWSER_VERSION}.release-manifest.json" \
            --ego-browser-release-archive "release-input/ego-browser/agent-remote-ego-browser-macos-universal-${BROWSER_VERSION}.tar.gz" \
            --ego-browser-release-manifest-checksum "release-input/ego-browser/agent-remote-ego-browser-${BROWSER_VERSION}.release-manifest.json.sha256" \
            --ego-browser-release-archive-checksum "release-input/ego-browser/agent-remote-ego-browser-macos-universal-${BROWSER_VERSION}.tar.gz.sha256" \
            --ego-browser-signing-evidence "release-input/ego-browser/agent-remote-ego-browser-macos-universal-${BROWSER_VERSION}.community-signing.json" \
            --ego-browser-signing-evidence-checksum "release-input/ego-browser/agent-remote-ego-browser-macos-universal-${BROWSER_VERSION}.community-signing.json.sha256" \
            --ego-browser-learning-bundle "$GITHUB_WORKSPACE/release-input/ego-browser/learning-bundle" \
            --ego-browser-archive-sigstore "release-input/ego-browser/agent-remote-ego-browser-macos-universal-${BROWSER_VERSION}.tar.gz.sigstore.json" \
            --ego-browser-manifest-sigstore "release-input/ego-browser/agent-remote-ego-browser-${BROWSER_VERSION}.release-manifest.json.sigstore.json" \
            --ego-browser-provenance "release-input/ego-browser/provenance.json" \
            --ego-browser-learning-bundle-digest "$BROWSER_LEARNING_BUNDLE_DIGEST" \
            --ego-browser-learning-bundle-verifier "$GITHUB_WORKSPACE/release-input/ego-browser-source/scripts/verify-learning-bundle.sh" \
            --automation-evidence "$community/automation.json" \
            --risk-acceptance "$community/risk-acceptance.json" \
            --ci-run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --issued-at "$issued_at" \
            --output-directory device-control-release-evidence)
          targets=(linux-amd64-glibc linux-arm64-glibc linux-amd64-musl linux-arm64-musl)
          for target in "${targets[@]}"; do
            arguments+=(
              --node-artifact "${target}=release-input/node/agent-remote-node-${NODE_VERSION}-${target}.tar.gz"
              --proxy-artifact "${target}=release-input/device/agent-remote-device-proxy-${target}-${DEVICE_VERSION}.tar.gz"
              --sbom "node-${target}=release-input/node/agent-remote-node-${NODE_VERSION}.spdx.json"
              --sbom "proxy-${target}=release-input/device/agent-remote-device-proxy-${target}-${DEVICE_VERSION}.spdx.json"
              --provenance "node-${target}=release-input/node-provenance-${target}.json"
              --provenance "proxy-${target}=release-input/proxy-provenance-${target}.json"
            )
          done
          if [ -n "$COMPUTER_USE_V2_RUN_ID" ]; then
            arguments+=(
              --computer-use-v2-evidence \
                release-input/community-v2/community-computer-use-v2-evidence.json
              --computer-use-v2-evidence-archive \
                release-input/community-v2/community-computer-use-v2.evidence.tar.gz
              --computer-use-v2-target "$COMPUTER_USE_V2_TARGET"
            )
          fi
          "${arguments[@]}"

          key="$RUNNER_TEMP/device-control-release-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$PRIVATE_KEY_PEM" > "$key"
          chmod 0600 "$key"
          uv sync --project release-input/server-source --frozen
          uv run --project release-input/server-source python \
            release-input/server-source/scripts/create_device_control_release_evidence.py \
            --draft device-control-release-evidence/release-evidence-draft.json \
            --private-key "$key" \
            --output "device-control-release-evidence/device-control-release-evidence-${DISTRIBUTION_VERSION}.json"
          (cd device-control-release-evidence && \
            checksums=$(mktemp) && \
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | \
            sort -z | xargs -0 sha256sum > "$checksums" && \
            mv "$checksums" SHA256SUMS)
          (cd device-control-release-evidence && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: community-device-control-release-evidence-${{ inputs.version }}
          path: device-control-release-evidence
          if-no-files-found: error
          retention-days: 30
