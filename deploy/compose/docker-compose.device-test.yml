services:
  server:
    environment:
      AGENT_REMOTE_ENV: development
      PUBLIC_BASE_URL: http://127.0.0.1:8000
      CORS_ALLOWED_ORIGINS: '["http://127.0.0.1:8080"]'
      DEVICE_CONTROL_ENABLED: "true"
      DEVICE_SESSION_RETENTION_DAYS: "0"
      DEVICE_SESSION_AUDIT_RETENTION_DAYS: "0"
    ports:
      - "8000:8000"

  admin-web:
    ports:
      - "8080:80"

  caddy:
    profiles:
      - production-edge
